[package]
name = "quickie-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mdns-sd = "0.21.6"
mime_guess = "2.0.5"
rcgen = "0.14.10"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spake2 = "0.4.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-std", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
