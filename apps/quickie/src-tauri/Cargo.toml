[package]
name = "quickie"
version = "0.1.0"
edition = "2024"

[lib]
name = "quickie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
quickie-core = { path = "../../../crates/quickie-core" }
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["fs", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
